<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="reminder-style.css" />
  </head>
  <body>
    <h2 id="title">Did you finish this task?</h2>
    <div class="domain" id="domain">loading...</div>
    <div class="card">
      <div
        id="url"
        style="font-size: 11px; word-break: break-all; color: #334155"
      ></div>
      <div
        id="meta"
        style="font-size: 11px; color: #64748b; margin-top: 6px"
      ></div>
    </div>
    <div class="row">
      <button class="btn secondary" id="finishBtn">✓ Finished</button>
      <button class="btn primary" id="returnBtn">↩ Return to Task</button>
    </div>
    <div class="muted">
      TaskRecall will auto-close this when you act. Cooldown 1hr after Finished.
    </div>
    <script src="reminder.js"></script>
  </body>
</html>
